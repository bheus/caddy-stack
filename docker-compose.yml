name: caddy

services:
  # Caddy needs to read container labels, which means Docker API access. Mounting
  # the socket into Caddy directly would hand an attacker who achieved RCE in an
  # internet-facing process the whole API: read every container's environment
  # (API keys, DB passwords), then start a privileged container and own the host.
  # `:ro` on a socket bind does NOT prevent that — it only stops the socket file
  # itself being replaced; the API behind it stays read-write.
  #
  # This proxy exposes only the handful of GET endpoints Caddy actually uses.
  # POST=0 is the setting that matters: it blocks container creation.
  dockersocket:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: caddy-dockersocket
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      # Required, despite CADDY_INGRESS_NETWORKS being set explicitly: without it
      # Caddy logs "Failed to get ingress networks" and falls back to guessing
      # upstream addresses.
      - NETWORKS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerapi

  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - dockersocket
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Restricts upstream resolution to the caddy network. Proxied containers
      # sit on several networks each; without this Caddy may pick the address of
      # a network it is not attached to and every route 502s.
      - CADDY_INGRESS_NETWORKS=caddy
      - DOCKER_HOST=tcp://dockersocket:2375
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - caddy
      - dockerapi
    # Routes for services that cannot carry their own labels, kept here so they
    # stay in git rather than becoming hand-edits that vanish on a redeploy.
    # Everything else labels itself in its own stack; add here only when the
    # service genuinely cannot join the caddy network.
    #
    #   homebridge - host networking, required for HomeKit mDNS/HAP discovery
    #   homebridge   - host networking, required for HomeKit mDNS/HAP discovery
    #   portainer    - not a compose stack at all, a hand-run container
    #   invoiceninja - the last web-editor stack, no git repo to push to
    #
    # These dial the host IP rather than a container, so they hairpin back
    # through the published port instead of going direct over the caddy network.
    #
    # Invoice Ninja is the one HTTPS route. It sets REQUIRE_HTTPS=true and
    # redirects anything arriving with X-Forwarded-Proto: http, so it must be
    # served over TLS. `tls internal` signs it with Caddy's local CA, whose root
    # has to be trusted on each client (see README).
    labels:
      - "caddy_1=http://homebridge.svc.lan"
      - "caddy_1.reverse_proxy=192.168.1.12:8581"
      - "caddy_2=http://portainer.svc.lan"
      - "caddy_2.reverse_proxy=192.168.1.12:9000"
      - "caddy_3=invoiceninja.svc.lan"
      - "caddy_3.tls=internal"
      - "caddy_3.reverse_proxy=192.168.1.12:8012"

networks:
  # Created out of band (see README) and declared external so the name never
  # picks up a compose project prefix. Every proxied service joins it by this
  # exact literal name from its own stack, so a prefix here would orphan all of
  # them at once.
  caddy:
    external: true
    name: caddy

  # Deliberately NOT the shared caddy network: putting the socket proxy there
  # would expose the Docker API to grafana, documenso and every other proxied
  # service. `internal` also denies it outbound access.
  dockerapi:
    internal: true

volumes:
  # External so a stack rename cannot silently replace it: this volume holds the
  # internal CA's root key. A fresh volume means a new root, and every client
  # that trusted the old one would need the certificate reinstalled.
  caddy-data:
    external: true
    name: caddy-stack_caddy-data
  # Derived from labels on every start; losing it costs nothing.
  caddy-config:
